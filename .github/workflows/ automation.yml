name: Selenium UI Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run automated tests
        run: mvn clean verify -Denvironment=ci