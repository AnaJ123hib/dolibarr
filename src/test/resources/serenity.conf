webdriver {
  driver = chrome
  autodownload = true
  timeouts {
      implicitlywait = 10000
    }
}

serenity {
  project.name = "Dolibarr Automation"
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = scenario
}

username = "demo"
password = "demo"

environments {

  default {

    webdriver.base.url = "https://demo.dolibarr.org/"

    webdriver.capabilities {

      browserName = "chrome"

      "goog:chromeOptions" {
        args = [
          "--no-sandbox",
          "--disable-dev-shm-usage",
          "--start-maximized",
          "--incognito",
          "--disable-features=PasswordLeakDetection"
        ]

        prefs {
          credentials_enable_service = false
          profile.password_manager_enabled = false
        }
      }
    }
  }

  ci {

    webdriver.base.url = "https://demo.dolibarr.org/"

    webdriver.capabilities {

      browserName = "chrome"

      "goog:chromeOptions" {
        args = [
          "--headless=new",
          "--window-size=1920,1080",
          "--no-sandbox",
          "--disable-dev-shm-usage",
          "--incognito",
          "--disable-features=PasswordLeakDetection"
        ]

        prefs {
          credentials_enable_service = false
          profile.password_manager_enabled = false
        }
      }
    }
  }
}