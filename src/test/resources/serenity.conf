webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"

        "goog:chromeOptions" {
          args = [
           # "--headless=new",
            "--no-sandbox",
            "--disable-dev-shm-usage",
            "--window-size=1920,1080",
            "--disable-features=PasswordLeakDetection",
            "--incognito"
          ]

          prefs {
            credentials_enable_service = false
            profile.password_manager_enabled = false
          }
        }
     }
}

webdriver.autodownload = true
username = "demo"
password = "demo"

serenity {

  project.name = "Dolibarr Automation"
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = scenario
}

environments {
  default {
    webdriver.base.url = "https://demo.dolibarr.org/"
  }
}